# Uçtan uca duman testi: giriş, harita/alan tarama, filtre, rotaya durak, rota oluşturma, yer sayfası
appId: app.yolustu
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: email
    timeout: 90000
    optional: true
- runFlow:
    when:
      visible:
        id: welcome-signin
    commands:
      - tapOn:
          id: welcome-signin
- extendedWaitUntil:
    visible:
      id: email
    timeout: 30000
- takeScreenshot: 01-signin
- tapOn:
    id: email
- inputText: ${EMAIL}
- tapOn:
    id: password
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: signin-submit
- extendedWaitUntil:
    visible:
      id: consent-terms
    timeout: 30000
- tapOn:
    id: consent-terms
- tapOn:
    id: consent-privacy
- tapOn:
    id: consent-accept

# Harita: ilk açılışta konum çevresi kendiliğinden taranır, alttaki liste dolar
- extendedWaitUntil:
    visible:
      id: area-count
    timeout: 90000
- takeScreenshot: 02-map-list
- assertVisible:
    id: place-row
- tapOn:
    id: place-row
    index: 0
- takeScreenshot: 03-selected

# Filtre: seçim anında uygulanmalı
- tapOn:
    id: open-filters
- tapOn: "Campsite"
- tapOn:
    id: filters-done
- extendedWaitUntil:
    visible:
      id: area-count
    timeout: 30000
- takeScreenshot: 04-filtered
- tapOn:
    id: open-filters
- tapOn: "Campsite"
- tapOn:
    id: filters-done

# Rotaya durak ekle (+), rota sekmesinde üstte görünmeli
- extendedWaitUntil:
    visible:
      id: stop-add
    timeout: 30000
- tapOn:
    id: stop-add
    index: 0
- assertVisible:
    id: stop-remove
- tapOn: "Route"
- extendedWaitUntil:
    visible: "Stops"
    timeout: 15000
- takeScreenshot: 05-route-stops
- tapOn:
    id: route-from
- tapOn:
    id: route-mylocation
- tapOn:
    id: route-to
- inputText: "Ankara"
- extendedWaitUntil:
    visible:
      id: geo-result
    timeout: 30000
- tapOn:
    id: geo-result
    index: 0
- tapOn:
    id: route-plan
- extendedWaitUntil:
    visible:
      id: route-summary
    timeout: 60000
- takeScreenshot: 06-route
# Durak − ile çıkarılır
- tapOn:
    id: stop-remove
    index: 0
- extendedWaitUntil:
    notVisible: "Stops"
    timeout: 15000

# Harita sekmesi: çift dokunuş yer sayfasını açar
- tapOn: "Map"
- extendedWaitUntil:
    visible:
      id: place-row
    timeout: 30000
- doubleTapOn:
    id: place-row
    index: 1
- extendedWaitUntil:
    visible: "Directions"
    timeout: 30000
- takeScreenshot: 07-place
