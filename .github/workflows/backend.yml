name: Sunucu (Supabase)

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

env:
  PROJECT_REF: jhnazkhvdtwqersdvrco

jobs:
  test:
    name: Veritabanı testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test paketleri
        working-directory: supabase/tests
        run: npm init -y >/dev/null && npm install --no-audit --no-fund @electric-sql/pglite@0.5.11 @electric-sql/pglite-postgis@0.2.11
      - name: Güvenlik kuralları testi
        run: node supabase/tests/rls.test.mjs

  deploy:
    name: Yayınla
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Gizli anahtarları kontrol et
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN ve SUPABASE_DB_PASSWORD GitHub secret olarak eklenmeden yayın atlanır."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest
      - name: Projeye bağlan
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Veritabanını güncelle
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all
      - name: Rota fonksiyonunu yayınla
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy route --project-ref "$PROJECT_REF" --use-api
      - name: Rota servisi anahtarı
        if: steps.secrets.outputs.ready == 'true' && env.ORS_API_KEY != ''
        run: supabase secrets set ORS_API_KEY="$ORS_API_KEY" --project-ref "$PROJECT_REF"
