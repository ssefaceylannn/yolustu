name: iOS simülatör testi

# Uygulamayı iPhone simülatöründe derleyip gerçek sunucuya karşı uçtan uca dener (Maestro).
# Geçici bir test hesabı açılır ve test sonunda silinir.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://jhnazkhvdtwqersdvrco.supabase.co
      SUPABASE_KEY: sb_publishable_DYyLfiyBMJsK_k2BJ-RQ5A_8kEhBoiL
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: En yeni Xcode'u seç
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      # Uygulama kodu değişmediyse (sadece test senaryosu) önceki derleme kullanılır
      - name: Derleme önbelleği
        id: appcache
        uses: actions/cache/restore@v4
        with:
          path: sim-app
          key: sim-app-${{ hashFiles('src/**', 'assets/**', 'app.json', 'package-lock.json') }}
      - name: Paketler
        if: steps.appcache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: iOS projesi
        if: steps.appcache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform ios --no-install
      - name: CocoaPods
        if: steps.appcache.outputs.cache-hit != 'true'
        working-directory: ios
        run: pod install
      - name: Simülatör için derle
        if: steps.appcache.outputs.cache-hit != 'true'
        working-directory: ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES build | tail -n 80
          mkdir -p ../sim-app && cp -R build/Build/Products/Release-iphonesimulator/*.app ../sim-app/
      # Test başarısız olsa da derleme saklansın
      - name: Derlemeyi sakla
        if: steps.appcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sim-app
          key: ${{ steps.appcache.outputs.cache-primary-key }}
      - name: Simülatörü aç ve uygulamayı kur
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(ls -d sim-app/*.app | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl location "$UDID" set 41.0082,28.9784
          xcrun simctl privacy "$UDID" grant location app.yolustu || true
      - name: Maestro kur
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Geçici test hesabı
        run: |
          EMAIL="yolustu.ci.${GITHUB_RUN_ID}@mailinator.com"
          PASS="Ci-$(openssl rand -hex 12)"
          echo "::add-mask::$PASS"
          RESP=$(curl -sS -X POST "$SUPABASE_URL/auth/v1/signup" -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\",\"data\":{\"username\":\"citest${GITHUB_RUN_ID: -6}\"}}")
          TOKEN=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then echo "Kayıt yanıtı:"; echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print({k:d.get(k) for k in ('code','error_code','msg','message')})"; exit 1; fi
          echo "::add-mask::$TOKEN"
          { echo "TEST_EMAIL=$EMAIL"; echo "TEST_PASS=$PASS"; echo "TEST_TOKEN=$TOKEN"; } >> "$GITHUB_ENV"
      - name: Uçtan uca test
        run: |
          set -o pipefail
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=300000 MAESTRO_CLI_NO_ANALYTICS=1
          # Tanıtım videosu: testin tamamı kaydedilir
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force demo.mp4 &
          REC=$!
          stop_rec() { kill -INT $REC 2>/dev/null; wait $REC 2>/dev/null || true; }
          trap stop_rec EXIT
          for i in 1 2; do
            if maestro --device "$UDID" test .maestro/smoke.yaml -e EMAIL="$TEST_EMAIL" -e PASSWORD="$TEST_PASS" --test-output-dir maestro-out --debug-output maestro-debug 2>&1 | tee maestro.log; then exit 0; fi
            grep -q "driver not ready" maestro.log || exit 1
            echo "Sürücü hazır değildi, tekrar deneniyor"
          done
          exit 1
      - name: Videoyu küçült
        if: always()
        run: |
          ls -la demo.mp4 || exit 0
          mkdir -p video
          # iPhone'da rahat oynasın: 720p, H.264
          if command -v ffmpeg >/dev/null; then ffmpeg -loglevel error -y -i demo.mp4 -vf "scale=-2:1280" -c:v libx264 -preset veryfast -crf 26 -movflags +faststart video/yolustu-iphone-demo.mp4 || cp demo.mp4 video/yolustu-iphone-demo.mp4; else cp demo.mp4 video/yolustu-iphone-demo.mp4; fi
          ls -la video
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-demo-video
          path: video/yolustu-iphone-demo.mp4
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sim-screens
          path: |
            maestro-out
            maestro-debug
            *.png
      - name: Test hesabını sil
        if: always() && env.TEST_TOKEN != ''
        run: |
          curl -sS -o /dev/null -w "silme HTTP %{http_code}\n" -X POST "$SUPABASE_URL/rest/v1/rpc/delete_my_account" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $TEST_TOKEN" -H "Content-Type: application/json" -d '{}'
      - name: Özet (en sonda okunur)
        if: always()
        run: |
          echo "=== Uygulama hata kayıtları ==="
          xcrun simctl spawn "$UDID" log show --last 10m --predicate 'process == "Yolustu" AND (messageType == error OR messageType == fault)' --style compact 2>/dev/null \
            | grep -v "xctest" | tail -25 || true
          echo "=== Ekrandaki öğeler (hata anı) ==="
          maestro --device "$UDID" hierarchy 2>/dev/null | python3 -c "
          import json,sys
          try: d=json.load(sys.stdin)
          except Exception: sys.exit(0)
          out=[]
          def walk(n):
              a=n.get('attributes',{})
              t=' | '.join(x for x in [a.get('resource-id',''),a.get('accessibilityText',''),a.get('text','')] if x)
              if t and t not in out: out.append(t)
              for c in n.get('children',[]): walk(c)
          walk(d); print('\n'.join(out[:80]))" || true
          echo "=== Maestro ==="
          grep -vE "^\s*$" maestro.log 2>/dev/null | tail -60 || true

  # Videoyu indirilebilir yere koy (Releases → iPhone tanıtım videosu)
  video:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-demo-video
          path: out
        continue-on-error: true
      - name: Yayınla
        if: hashFiles('out/yolustu-iphone-demo.mp4') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-demo
          name: "iPhone tanıtım videosu"
          body: "Uygulamanın iPhone simülatöründe çalışırken kaydı (${{ github.sha }})."
          prerelease: true
          make_latest: false
          files: out/yolustu-iphone-demo.mp4
