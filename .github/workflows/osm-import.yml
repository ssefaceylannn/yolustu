name: Harita verisi (OpenStreetMap)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Ne aktarılsın?"
        type: choice
        options: [all, provinces, places]
        default: all
  schedule:
    - cron: "17 3 1 * *" # her ayın 1'i, yerleri güncelle

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Paket
        working-directory: scripts
        run: npm init -y >/dev/null && npm install --no-audit --no-fund osmtogeojson@3.0.0-beta.5
      - name: Aktar
        # Gizli anahtar sadece bu adımda görünür (paket kurulumu göremez)
        env:
          SUPABASE_URL: https://jhnazkhvdtwqersdvrco.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ github.event.inputs.mode || 'places' }}
        run: node scripts/osm-import.mjs "$MODE"
